name: Watchdog Sentinel

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule can be delayed; minute 17 avoids the busiest top-of-hour slot.
    - cron: '17 * * * *'

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load workflow .env
        uses: ./.github/actions/load-dotenv
        with:
          env_text: ${{ secrets.PUSH_ENV_FILE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Sentinel Watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python core/watchdog.py
