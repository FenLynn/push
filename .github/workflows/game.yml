name: "Module: Game Schedule"

on:
  workflow_dispatch:
    inputs:
      notify:
        description: "是否检查并通知临近的重点比赛"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load workflow .env
        uses: ./.github/actions/load-dotenv
        with:
          env_text: ${{ secrets.PUSH_ENV_FILE }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Refresh game snapshot
        run: python main.py gen game --force

      - name: Notify one important match at most once
        if: ${{ inputs.notify != 'false' }}
        run: python scripts/notify_game.py
