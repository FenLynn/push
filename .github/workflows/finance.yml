name: "Module: Finance Report"

on:
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * 1-5'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load workflow .env
        uses: ./.github/actions/load-dotenv
        with:
          env_text: ${{ secrets.PUSH_ENV_FILE }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Chinese chart font
        run: |
          python -c "from sources.finance.plot import Plotter; p = Plotter(); assert p.cjk_font_ready, 'CJK chart font is unavailable'; print(f'Chart font: {p.cjk_font_family} ({p.cjk_font_path})')"
        
      - name: Run Finance
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py gen finance --force
          else
            python main.py gen finance
          fi
