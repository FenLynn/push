name: "Shared KV: Access smoke test"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-data-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Access and disposable snapshot
        env:
          STATUS_PUSH_URL: ${{ secrets.STATUS_PUSH_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python scripts/shared_data_smoke.py
