name: Load Push Dotenv
description: Materialize a sanitized push .env file from one GitHub Actions secret without exporting the full file to the job environment.

inputs:
  env_text:
    description: Full .env content stored in the PUSH_ENV_FILE secret.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENV_TEXT: ${{ inputs.env_text }}
      run: |
        set -euo pipefail

        if [ -z "${ENV_TEXT:-}" ]; then
          echo "::error::PUSH_ENV_FILE secret is empty. Please paste the full push .env content into that secret."
          exit 1
        fi

        tmp_file="$(mktemp)"
        printf '%s\n' "$ENV_TEXT" | tr -d '\r' > "$tmp_file"

        if grep -Eq '^(HTTP_PROXY|HTTPS_PROXY|http_proxy|https_proxy|ALL_PROXY|all_proxy|NO_PROXY|no_proxy)=' "$tmp_file"; then
          echo "Removing local proxy variables from PUSH_ENV_FILE for GitHub Actions."
        fi

        grep -Ev '^(HTTP_PROXY|HTTPS_PROXY|http_proxy|https_proxy|ALL_PROXY|all_proxy|NO_PROXY|no_proxy)=' "$tmp_file" > .env || true
        rm -f "$tmp_file"

        printf 'RUN_MODE=cloud\n' >> "$GITHUB_ENV"
        printf 'TZ=Asia/Shanghai\n' >> "$GITHUB_ENV"
        printf 'PUSH_R2_PUBLIC_BASE_URL=https://whoisyourdaddyqywx-worker.660415.xyz/api/public/push-assets\n' >> "$GITHUB_ENV"
