name: "Shared KV: Remove old exposed logs"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Permanently delete ONLY the 11 reviewed historical smoke logs; keep run results.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: shared-kv-reviewed-log-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out reviewed cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Delete only reviewed old log files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/shared_data_logs_cleanup.py --confirm
