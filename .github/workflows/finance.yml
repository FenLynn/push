name: "Module: Finance Report"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finance.yml"
      - "sources/finance/official_series.py"
      - "sources/finance/indicators/structural_macro.py"
      - "sources/finance/archive_catalog.py"
  workflow_dispatch:
    inputs:
      indicators:
        description: "可选：逗号分隔的指标名；留空运行全部"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load workflow .env
        uses: ./.github/actions/load-dotenv
        with:
          env_text: ${{ secrets.PUSH_ENV_FILE }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Chinese chart font
        run: |
          python -c "from sources.finance.plot import Plotter; p = Plotter(); assert p.cjk_font_ready, 'CJK chart font is unavailable'; print(f'Chart font: {p.cjk_font_family} ({p.cjk_font_path})')"
        
      - name: Run Finance
        env:
          # Source changes only rebuild the structural archive. Scheduled/manual
          # dispatch keeps its existing input semantics (blank means all).
          FINANCE_INDICATORS: ${{ github.event_name == 'push' && 'population,demography,fertility,ageing,marriage,unemployment,labour,fiscal,fiscalmonthly,taxstructure,governmentdebt' || inputs.indicators || '' }}
        run: |
          python main.py gen finance --force
