name = "push-snapshot-worker"
main = "src/index.js"
compatibility_date = "2024-03-01"
workers_dev = true

# 绑定 B 账号用于存放 optics 快照的 KV。
[[kv_namespaces]]
binding = "SNAPSHOT_KV"
id = "FILL_ME_OPTICS_SNAPSHOT_KV_ID"
preview_id = "FILL_ME_OPTICS_SNAPSHOT_KV_PREVIEW_ID"

[vars]
OPTICS_SNAPSHOT_KV_KEY = "snapshot:paper:optics:latest"
OPTICS_SNAPSHOT_CACHE_TTL = "120"

# 如需私有访问，请使用：wrangler secret put SNAPSHOT_ACCESS_KEY