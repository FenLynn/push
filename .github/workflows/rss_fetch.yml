name: RSS Fetch to Cloudflare D1

on:
  workflow_dispatch:
    # Allow manual trigger

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load workflow .env
      uses: ./.github/actions/load-dotenv
      with:
        env_text: ${{ secrets.PUSH_ENV_FILE }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser python-dotenv

    - name: Generate Feeds JSON
      # In case default.ini was updated but feeds.json wasn't
      run: python scripts/generate_feeds_json.py

    - name: Run Fetch Script
      run: python scripts/fetch_to_d1.py
