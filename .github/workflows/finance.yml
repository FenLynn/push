name: "Module: Finance Report"

on:
  workflow_dispatch:
    inputs:
      indicators:
        description: "可选：逗号分隔的指标名；留空运行全部"
        required: false
        default: ""
  schedule:
    # Full refresh every day at 23:20 Beijing time.
    - cron: '20 15 * * *'
    # Overseas market close refresh, 06:30 Beijing time Monday-Friday.
    - cron: '30 22 * * 0-4'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load workflow .env
        uses: ./.github/actions/load-dotenv
        with:
          env_text: ${{ secrets.PUSH_ENV_FILE }}
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Chinese chart font
        run: |
          python -c "from sources.finance.plot import Plotter; p = Plotter(); assert p.cjk_font_ready, 'CJK chart font is unavailable'; print(f'Chart font: {p.cjk_font_family} ({p.cjk_font_path})')"
        
      - name: Run Finance
        env:
          FINANCE_INDICATORS: ${{ inputs.indicators || (github.event.schedule == '30 22 * * 0-4' && 'commodity,sox') || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py gen finance --force
          else
            python main.py gen finance
          fi
