name: "Module: Estate Push"

on:
  workflow_dispatch:
    inputs:
      schedule_slot:
        description: '由调度器传入的唯一计划槽位；手动运行留空'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load workflow .env
        uses: ./.github/actions/load-dotenv
        with:
          env_text: ${{ secrets.PUSH_ENV_FILE }}

      - name: Claim scheduled slot
        id: claim-scheduled-slot
        run: python scripts/claim_scheduled_job.py --job estate --slot '${{ inputs.schedule_slot }}'
        
      - name: Set up Python
        if: steps.claim-scheduled-slot.outputs.claimed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install System Dependencies
        if: steps.claim-scheduled-slot.outputs.claimed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          
      - name: Install dependencies
        if: steps.claim-scheduled-slot.outputs.claimed == 'true'
        run: pip install -r requirements.txt
        
      - name: Run Estate
        if: steps.claim-scheduled-slot.outputs.claimed == 'true'
        run: python main.py gen estate --force
